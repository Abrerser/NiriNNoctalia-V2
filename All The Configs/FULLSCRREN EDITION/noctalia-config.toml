[backdrop]
blur_intensity = 0.15999999642372131
enabled = true

[bar.default]
auto_hide = true
background_opacity = 0.0
capsule = true
capsule_border_width = 8.0
capsule_padding = 0.0
capsule_radius = 0
compositor_blur = false
concave_edge_corners = false
end = [ "media", "tray", "notifications", "clipboard", "group:g1" ]
font_weight = 100
layer = "overlay"
margin_ends = 0
radius = 0
reserve_space = false
start = [ "workspaces" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "network", "brightness", "volume", "bluetooth", "battery" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 20

[control_center]
hidden_tabs = [ "weather", "screen-time" ]
show_avatar_border = false
show_session_button = false
show_shortcut_labels = false
width = 600

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 368.0
    cy = 456.0
    output = "eDP-2"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        audio_visualizer = true
        background = false
        hide_when_no_media = true
        layout = "horizontal"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    resume_command = "30"
    timeout = 660.0

[lockscreen]
transition = []

[lockscreen_widgets]
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-2", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-2"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 144.0
    box_width = 768.0
    cx = 957.0
    cy = 784.0
    output = "eDP-2"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        album_art_background = false
        audio_visualizer = true
        hide_when_no_media = true

[nightlight]
enabled = true
temperature_day = 1100

[shell]
avatar_path = "/home/abrerser/Pictures/Avatar/pfp.jpg"
circular_avatar = false
corner_radius_scale = 0.0
font_family = "JetBrains Mono ExtraLight"
polkit_agent = true
settings_window_translucent = true
show_close_buttons = false

    [shell.launcher]
    categories = false
    layout = "simple"
    pinned = [ "spotify-launcher" ]

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    control_center_placement = "floating"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    shadow = false
    transparency_mode = "glass"
    wallpaper_show_names = false

    [shell.session]
    grid_columns = 1
    show_shortcuts = false

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "destructive"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "default"

[theme]
source = "wallpaper"
terminal_colors = "standard"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "niri" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/abrerser/Pictures/Wallpaper/WP.png"

    [wallpaper.last]
    path = "/home/abrerser/Pictures/Wallpaper/WP.png"

    [wallpaper.monitors.eDP-2]
    path = "/home/abrerser/Pictures/Wallpaper/WP.png"

[weather]
enabled = false
